[package]
name = "tagent"
version = "0.1.0"
edition = "2021"
description = "ta — a small BYOK coding agent for Termux"
license = "MIT"

[[bin]]
name = "ta"
path = "src/main.rs"

[lib]
name = "tagent"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
