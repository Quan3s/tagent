[package]
name = "tagent"
version = "0.1.0"
edition = "2021"
description = "ta — a small BYOK coding agent for Termux"
license = "MIT"

[[bin]]
name = "ta"
path = "src/main.rs"

[lib]
name = "tagent"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "ws"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.28"
futures-util = "0.3"
ignore = "0.4"
mime_guess = "2"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
ring = "0.17"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.54", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = "1"
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
